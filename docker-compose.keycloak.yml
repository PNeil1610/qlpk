version: '3.8'

# =====================================================================
# Keycloak Identity Provider cho QLPK
# Chạy: docker compose -f docker-compose.keycloak.yml up -d
# Admin UI: http://localhost:8180/admin
# Admin: admin / admin
# =====================================================================

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: qlpk_keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      # Lưu data vào volume để không mất khi restart
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass
    ports:
      - "8180:8180"
    depends_on:
      keycloak_db:
        condition: service_healthy
    networks:
      - keycloak_net
    restart: unless-stopped

  keycloak_db:
    image: postgres:15-alpine
    container_name: qlpk_keycloak_db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pass
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - keycloak_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  keycloak_db_data:
    driver: local

networks:
  keycloak_net:
    driver: bridge
